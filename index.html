<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyntaxWear - Tênis e Sneakers Online</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components/header.css" />

  </head>
  <body>
    <header class="header">
      <!-- Adicione o logotipo da marca e a navegação principal aqui -->
       <h1 class="logo">
          <a href="#" title="SyntaxWear - Tênis e Sneakers Online">
              <img src="./assets/images/logo/Logo.svg" alt="SyntaxWear - Tênis e Sneakers Online" />
          </a>
       </h1>
      <nav class="nav-center" aria-label="Categorias principais">
        <ul class="nav-list">
          <li class="nav-item"><a href="#" class="nav-link">Masculino</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Feminino</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Outlet</a></li>
        </ul>
      </nav>
      <nav class="nav-right" aria-label="Links de apoio e conta">
        <ul class="nav-utility-list">
          <li><a class="nav-utility" href="#" class="nav-utility-link">Nossas lojas</a></li>
          <li><a class="nav-utility" href="#" class="nav-utility-link">Sobre</a></li>
          <li>
            <a class="nav-icon" href="#" aria-label="Minha conta">
              <img src="./assets/images/icons/user.svg" alt="Ícone de usuário" />
            </a>
          </li>
          <li>
            <a class="nav-icon" href="#" aria-label="Ajuda">
              <img src="./assets/images/icons/help.svg" alt="Ícone de ajuda" />
            </a>
          </li>
          <li>
            <a class="nav-icon" href="#" aria-label="Sacola de compras">
              <img src="./assets/images/icons/bag.svg" alt="Ícone de sacola de compras" />
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero" aria-label="Destaque principal"></section>

      <section class="categories" aria-label="Categorias de produtos"></section>

      <section class="featured-products" aria-label="Produtos em destaque">
        <div class="product-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <address class="contact-info"></address>
      <nav class="footer-links" aria-label="Links do rodapé"></nav>
    </footer>
  </body>
</html>
